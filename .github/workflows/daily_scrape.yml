name: Daily Kaikatsu Scraper & Web Deploy

on:
  schedule:
    # 毎日 夜23:25 JST (UTC 14:25) - 遅延考慮の前倒し実行
    - cron: '25 14 * * *'
  workflow_dispatch: # GitHubのWeb画面から手動実行できるボタン

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.10 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: スクレイピング＆データ更新の実行
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python run_actions.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name "pan-forge"
          git config user.email "panforge.lab@gmail.com"
          git add stores.json
          if git diff --staged --quiet; then
            echo "データに変更はありませんでした。"
          else
            git commit -m "Auto-update: 快活CLUB最新料金データの自動更新 [skip ci]"
            git push origin main
          fi
